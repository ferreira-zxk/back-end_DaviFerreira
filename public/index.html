<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha Loja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>🛍️ Minha Loja</h1>
      <div id="area-usuario" hidden>
        <span id="saudacao"></span>
        <button type="button" id="botao-sair" class="editar">Sair</button>
      </div>
    </header>

    <form id="form-login">
      <h2 id="titulo-login">Entrar</h2>
      <input type="text" id="login-nome" placeholder="Seu nome" hidden>
      <input type="email" id="login-email" placeholder="E-mail">
      <input type="password" id="login-senha" placeholder="Senha">
      <div class="botoes">
        <button type="submit" id="botao-entrar">Entrar</button>
        <button type="button" id="botao-alternar" class="editar">Criar conta</button>
      </div>
      <p id="mensagem-login"></p>
    </form>

    <form id="formulario" hidden>
      <h2 id="titulo-form">Cadastrar produto</h2>
      <input type="text" id="nome" placeholder="Nome do produto">
      <input type="number" id="preco" placeholder="Preço" step="0.01">
      <div class="botoes">
        <button type="submit" id="botao-salvar">Cadastrar</button>
        <button type="button" id="botao-cancelar" hidden>Cancelar</button>
      </div>
      <p id="mensagem"></p>
    </form>

    <h2>Produtos</h2>
    <ul id="lista"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
